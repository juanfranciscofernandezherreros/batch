spring:
  application.name: csv-point-by-point-batch
  main.web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/results_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-init-sql: SET search_path TO ${DB_SCHEMA:point_by_point},public
      data-source-properties.reWriteBatchedInserts: true
  flyway:
    schemas: ${DB_SCHEMA:point_by_point}
    default-schema: ${DB_SCHEMA:point_by_point}
  batch:
    job.enabled: false
    jdbc.initialize-schema: never
    jdbc.table-prefix: point_by_point_batch.BATCH_
app:
  cli.enabled: true
  csv.allowed-root: ${CSV_ALLOWED_ROOT:/data/csv}
  batch.chunk-size: ${BATCH_CHUNK_SIZE:500}
